# Task before assigning roles  
- hosts: all
  connection: local
  tags: always
  become: true
  pre_tasks:
    - name: pre-run | update package cache (fedora)
      dnf: 
        update_cache: yes
      changed_when: False
      when: aansible_facts['distribution'] in ["Fedora"]

    - name: pre-run | update package cache (Ubuntu/Debian)
      apt:
        update_cache: yes
      changed_when: False
      when: ansible_facts['distribution'] in ["Ubuntu","Debian"]

    - name: pre-run | update package cache (Arch)
      pacman:
         update_cache: yes
      changed_when: False
      when: ansible_facts['distribution'] == "Archlinux"

- hosts: all
  tags: base
  become: true
  roles:
    - base

- hosts: workstation
  tags: workstation
  become: true
  roles:
    - workstation

- hosts: gaming
  tags: gaming
  become: true
  roles:
    - gaming

- hosts: macbook
  tags: macbook
  become: true
  roles:
    - macbook
